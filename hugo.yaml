baseURL: "https://sklast1104.github.io/sklast1104/"
languageCode: ko-KR
title: "Dev Blog"  # 블로그 제목
theme: PaperMod

# 빌드 설정
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# 한국어 설정
defaultContentLanguage: ko

# 코드 하이라이팅
pygmentsUseClasses: true

# 메뉴
menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: archives
      name: Archive
      url: /archives/
      weight: 30
    - identifier: search
      name: Search
      url: /search/
      weight: 40

# 출력 포맷 (검색 기능용)
outputs:
  home:
    - HTML
    - RSS
    - JSON

# PaperMod 테마 설정
params:
  env: production
  title: "Dev Blog"
  description: "개발 블로그"
  author: "jm"

  # 다크모드 토글
  defaultTheme: auto
  disableThemeToggle: false

  # 홈페이지 모드 (profile, home, cards 중 선택)
  homeInfoParams:
    Title: "Welcome"
    Content: "클라이언트 개발자의 기술 블로그"

  # 소셜 아이콘
  socialIcons:
    - name: github
      url: "https://github.com/sklast1104"
    # - name: linkedin
    #   url: "https://linkedin.com/in/YOUR_USERNAME"

  # 포스트 페이지 설정
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: false

  # 검색 설정
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

# 마크다운 설정
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    style: monokai
  goldmark:
    renderer:
      unsafe: true  # Mermaid 등 HTML 허용
