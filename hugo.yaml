baseURL: "https://sklast1104.github.io/sklast1104/"
languageCode: ko-KR
title: "jm's Dev Blog"
theme: Stack

# 빌드 설정
enableRobotsTXT: true
enableEmoji: true

# 한글 날짜 포맷
defaultContentLanguage: ko

# 퍼머링크 설정
permalinks:
  posts: /p/:slug/
  pages: /:slug/

# 메뉴
menu:
  main: []
  social:
    - identifier: github
      name: GitHub
      url: https://github.com/sklast1104
      params:
        icon: brand-github

# 출력 포맷
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Stack 테마 설정
params:
  # 사이트 기본 설정
  mainSections:
    - posts
  featuredImageField: image
  rssFullContent: true

  # 날짜 포맷
  dateFormat:
    published: 2006-01-02
    lastUpdated: 2006-01-02 15:04

  # 사이드바 설정
  sidebar:
    subtitle: "클라이언트 개발자"
    avatar:
      enabled: true
      local: true
      src: img/avatar.jpg

  # 글 목록 설정
  article:
    math: false
    toc: true
    readingTime: true
    license:
      enabled: false

  # 댓글 (필요시 활성화)
  comments:
    enabled: false

  # 위젯 설정 (사이드바)
  widgets:
    homepage:
      - type: search
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 20
    page:
      - type: toc

  # 컬러 스킴
  colorScheme:
    toggle: true
    default: auto

  # 이미지 처리
  imageProcessing:
    cover:
      enabled: true
    content:
      enabled: true

# 마크다운 설정
markup:
  highlight:
    codeFences: true
    guessSyntax: true
    lineNos: true
    noClasses: false
  goldmark:
    extensions:
      typographer: false
    renderer:
      unsafe: true
    parser:
      autoHeadingID: true
      autoHeadingIDType: github

# 관련 포스트
related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200
